name: Publish to PyPI

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to publish, for example v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout@v4
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Python
        # actions/setup-python@v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload distributions
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/checkpoint-cli/
    permissions:
      id-token: write
    steps:
      - name: Check out repository
        # actions/checkout@v4
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Download distributions
        # actions/download-artifact@v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        # pypa/gh-action-pypi-publish@v1.13.0
        uses: pypa/gh-action-pypi-publish@v1.14.0

      - name: Verify PyPI latest version
        run: |
          for attempt in 1 2 3 4 5; do
            if python scripts/sync_release_surfaces.py --check-pypi; then
              exit 0
            fi
            sleep 10
          done
          python scripts/sync_release_surfaces.py --check-pypi
