[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "checkpoint-cli"
version = "0.1.0"
description = "Local-first CLI for ContextOS repo-native AI engineering continuity"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "ContextOS contributors" }
]
keywords = [
  "ai",
  "agents",
  "cli",
  "context",
  "developer-tools",
  "handoff",
  "markdown"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Utilities"
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0"
]

[project.urls]
Homepage = "https://github.com/bkalyankumar/contextos"
Issues = "https://github.com/bkalyankumar/contextos/issues"
Changelog = "https://github.com/bkalyankumar/contextos/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "mypy>=1.18.0",
  "pytest>=8.0.0",
  "ruff>=0.14.0",
  "vulture>=2.14"
]

[project.scripts]
checkpoint = "checkpoint_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["contextos-codex-starter"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 80
exclude = ["contextos-codex-starter"]
