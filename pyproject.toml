[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "checkpoint-cli"
version = "0.1.4"
description = "Give any AI coding agent instant context on your project — resume anywhere in seconds"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "ContextOS contributors" }
]
keywords = [
  "ai",
  "ai-agents",
  "claude",
  "cli",
  "codex",
  "context-engineering",
  "developer-tools",
  "handoff",
  "llm",
  "markdown",
  "multi-agent"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Version Control",
  "Topic :: Utilities"
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0"
]

[project.urls]
Homepage = "https://github.com/bkalyankumar/contextos"
Documentation = "https://github.com/bkalyankumar/contextos#readme"
Issues = "https://github.com/bkalyankumar/contextos/issues"
Changelog = "https://github.com/bkalyankumar/contextos/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "mypy>=1.18.0",
  "pytest>=8.0.0",
  "ruff>=0.14.0",
  "vulture>=2.14"
]
mcp = [
  "mcp>=1.0.0"
]
sync = [
  "cryptography>=42.0.0"
]

[project.scripts]
checkpoint = "checkpoint_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 80
